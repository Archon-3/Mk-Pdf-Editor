# Render Blueprint for the Flask backend (https://render.com/docs/blueprint-spec).
# Deploy via Render Dashboard -> New -> Blueprint, or create a Web Service manually with:
#   Runtime: Docker, Dockerfile path: backend/Dockerfile, Docker build context: .
services:
  - type: web
    name: mk-pdf-editor-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    # Optional: keep admin settings/users across deploys (disks are not available on the free plan).
    # disk:
    #   name: backend-output
    #   mountPath: /app/backend/output
    #   sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Public URL of the deployed frontend (PayPal return/cancel links)
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # PayPal
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_DEMO
        value: "0"
      # Firebase web app keys (read by the backend for the admin setup checklist)
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_ADSENSE_CLIENT_ID
        sync: false
